<!DOCTYPE html>
<html>
<head>
<title>Love You ❤️</title>
<style>
body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,#ffd1e3,#fff0f6);
  font-family:Arial,sans-serif;
}

#love{
  position:absolute;
  inset:0;
}

.word{
  position:absolute;
  color:#e83e79;
  font-weight:bold;
  font-size:18px;
  animation:float 4s infinite ease-in-out;
}

@keyframes float{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-20px) scale(1.15);}
}

.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:25px 35px;
  border-radius:25px;
  box-shadow:0 10px 35px #e99ab8;
  z-index:10;
  text-align:center;
}

.center h1{
  color:#e83e79;
  font-size:38px;
  margin:0;
}
</style>
</head>

<body>

<div id="love"></div>

<div class="center">
  <h1>LOVE YOU ❤️</h1>
</div>

<script>
let box=document.getElementById("love");

for(let i=0;i<250;i++){

  let text=document.createElement("div");

  text.className="word";
  text.innerHTML="Love You ❤️";

  text.style.left=Math.random()*100+"vw";
  text.style.top=Math.random()*100+"vh";
  text.style.animationDelay=Math.random()*4+"s";
  text.style.fontSize=(12+Math.random()*15)+"px";
  text.style.opacity=(0.35+Math.random()*0.65);

  box.appendChild(text);
}
</script>

</body>
</html>
